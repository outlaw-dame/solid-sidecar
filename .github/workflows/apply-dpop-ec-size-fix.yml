name: Apply DPoP EC size fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-pr5-sdk-dpop-baseline
          fetch-depth: 0
      - name: Derive default algorithm from EC key size
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('sdk/ts/src/auth/dpop-keystore.ts')
          text = path.read_text()
          old = """      defaultAlgorithm:
        config.defaultAlgorithm ?? DEFAULT_DPOP_KEYSTORE_CONFIG.defaultAlgorithm,
      ecKeySize: config.ecKeySize ?? DEFAULT_DPOP_KEYSTORE_CONFIG.ecKeySize,"""
          new = """      defaultAlgorithm:
        config.defaultAlgorithm ??
        ({
          256: 'ES256',
          384: 'ES384',
          521: 'ES512',
        } as const)[
          config.ecKeySize ?? DEFAULT_DPOP_KEYSTORE_CONFIG.ecKeySize
        ],
      ecKeySize: config.ecKeySize ?? DEFAULT_DPOP_KEYSTORE_CONFIG.ecKeySize,"""
          if old not in text:
            raise SystemExit('default algorithm marker not found')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/apply-dpop-ec-size-fix.yml').unlink()
          PY
      - name: Commit EC size fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sdk/ts/src/auth/dpop-keystore.ts .github/workflows/apply-dpop-ec-size-fix.yml
          git commit -m "Honor configured DPoP EC key size"
          git push origin HEAD:agent/phase-pr5-sdk-dpop-baseline
