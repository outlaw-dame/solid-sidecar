name: TypeScript SDK

on:
  pull_request:
    paths:
      - 'sdk/ts/**'
      - '.github/workflows/typescript-sdk.yml'
  push:
    branches:
      - main
    paths:
      - 'sdk/ts/**'
      - '.github/workflows/typescript-sdk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typescript-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build, and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/ts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdk/ts/package.json

      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund 2>&1 | tee install.log

      - name: Typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log

      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log

      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Verify package contents
        run: |
          set -o pipefail
          npm run pack:check 2>&1 | tee pack.log

      - name: Upload verification logs and generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-sdk-verify-${{ github.run_id }}
          path: |
            sdk/ts/package-lock.json
            sdk/ts/install.log
            sdk/ts/typecheck.log
            sdk/ts/test.log
            sdk/ts/build.log
            sdk/ts/pack.log
          if-no-files-found: warn
          retention-days: 7
