name: TypeScript SDK

on:
  pull_request:
    paths:
      - 'sdk/ts/**'
      - '.github/workflows/typescript-sdk.yml'
  push:
    branches:
      - main
    paths:
      - 'sdk/ts/**'
      - '.github/workflows/typescript-sdk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typescript-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build, and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/ts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sdk/ts/package.json

      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: npm run pack:check
