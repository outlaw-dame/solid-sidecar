name: Apply DPoP type fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-pr5-sdk-dpop-baseline
          fetch-depth: 0
      - name: Apply focused type corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('sdk/ts/src/auth/dpop-keystore.ts')
          text = path.read_text()
          replacements = [
            (
              "  'storage'\n> & {\n  storage?: DpopKeyStorage;\n};",
              "  'storage'\n> & {\n  storage: DpopKeyStorage | undefined;\n};",
            ),
            (
              "      kid: stored.kid,\n      createdAt: stored.createdAt,",
              "      ...(stored.kid && { kid: stored.kid }),\n      createdAt: stored.createdAt,",
            ),
            (
              "      kid: keyPair.kid,\n      createdAt: keyPair.createdAt,",
              "      ...(keyPair.kid && { kid: keyPair.kid }),\n      createdAt: keyPair.createdAt,",
            ),
            (
              "    const header: DpopHeader = {\n      typ: 'dpop+jwt',\n      alg: this.getAlgorithmFromKey(keyPair.publicKey),",
              "    const algorithm = this.getAlgorithmFromKey(keyPair.publicKey);\n    const header: DpopHeader = {\n      typ: 'dpop+jwt',\n      alg: algorithm,",
            ),
            (
              "      keyPair.privateKey,\n      header.alg\n    );",
              "      keyPair.privateKey,\n      algorithm\n    );",
            ),
          ]
          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'marker not found: {old[:80]}')
            text = text.replace(old, new, 1)
          path.write_text(text)
          Path('.github/workflows/apply-dpop-type-fixes.yml').unlink()
          PY
      - name: Commit focused fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sdk/ts/src/auth/dpop-keystore.ts .github/workflows/apply-dpop-type-fixes.yml
          git commit -m "Fix exact optional DPoP typing"
          git push origin HEAD:agent/phase-pr5-sdk-dpop-baseline
