name: Apply SDK auth baseline repair

on:
  push:
    branches:
      - agent/phase-pr4-sdk-auth-baseline

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-pr4-sdk-auth-baseline
          fetch-depth: 0
      - name: Apply bounded source repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('sdk/ts/src/auth/auth-manager.ts')
          text = path.read_text()

          text = text.replace(
              "import { generateUuid, base64UrlEncode, sha256Base64UrlSync } from '../utils';",
              "import { generateUuid, base64UrlEncode, nullLogger, sha256Base64UrlSync } from '../utils';",
          )

          marker = "export const DEFAULT_AUTH_MANAGER_CONFIG: Partial<AuthManagerConfig> = {\n  scopes: ['openid', 'profile', 'webid'],\n  useDpop: true,\n  dpopKeyStoreConfig: DEFAULT_DPOP_KEYSTORE_CONFIG,\n};"
          replacement = "type ResolvedAuthManagerConfig = Omit<Required<AuthManagerConfig>, 'clientSecret'> & {\n  clientSecret?: string;\n};\n\nexport const DEFAULT_AUTH_MANAGER_CONFIG: Pick<\n  ResolvedAuthManagerConfig,\n  'scopes' | 'useDpop' | 'dpopKeyStoreConfig' | 'logger'\n> = {\n  scopes: ['openid', 'profile', 'webid'],\n  useDpop: true,\n  dpopKeyStoreConfig: DEFAULT_DPOP_KEYSTORE_CONFIG,\n  logger: nullLogger,\n};"
          if marker not in text:
              raise SystemExit('default config marker not found')
          text = text.replace(marker, replacement, 1)

          text = text.replace(
              'private readonly config: Required<AuthManagerConfig>;',
              'private readonly config: ResolvedAuthManagerConfig;',
              1,
          )
          text = text.replace(
              'logger: config.logger || console,',
              'logger: config.logger ?? DEFAULT_AUTH_MANAGER_CONFIG.logger,',
              1,
          )

          footer = "\n// ============================================================================\n// Exports\n// ============================================================================\n\nexport { InMemoryTokenStorage, SecureTokenStorage, generatePkcePair };\nexport type { TokenStorage };\n"
          if footer not in text:
              raise SystemExit('redundant export footer not found')
          text = text.replace(footer, '\n', 1)

          path.write_text(text)
          Path('.github/workflows/sdk-auth-baseline-fix.yml').unlink()
          PY
      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sdk/ts/src/auth/auth-manager.ts .github/workflows/sdk-auth-baseline-fix.yml
          git commit -m "Repair TypeScript auth manager configuration typing"
          git push origin HEAD:agent/phase-pr4-sdk-auth-baseline
