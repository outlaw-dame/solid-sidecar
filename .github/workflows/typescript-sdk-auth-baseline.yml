name: TypeScript SDK auth baseline

on:
  pull_request:
    paths:
      - 'sdk/ts/src/auth/auth-manager.ts'
      - '.github/workflows/typescript-sdk-auth-baseline.yml'
      - '.github/workflows/sdk-auth-review-fix.yml'
  push:
    branches:
      - main
    paths:
      - 'sdk/ts/src/auth/auth-manager.ts'
      - '.github/workflows/typescript-sdk-auth-baseline.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: typescript-sdk-auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-review-finding:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Preserve defaults for explicitly undefined options
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('sdk/ts/src/auth/auth-manager.ts')
          text = path.read_text()
          old = """    this.config = {
      ...DEFAULT_AUTH_MANAGER_CONFIG,
      ...config,
      logger: config.logger ?? DEFAULT_AUTH_MANAGER_CONFIG.logger,
    };"""
          new = """    this.config = {
      ...DEFAULT_AUTH_MANAGER_CONFIG,
      ...config,
      scopes: config.scopes ?? DEFAULT_AUTH_MANAGER_CONFIG.scopes,
      useDpop: config.useDpop ?? DEFAULT_AUTH_MANAGER_CONFIG.useDpop,
      dpopKeyStoreConfig:
        config.dpopKeyStoreConfig ?? DEFAULT_AUTH_MANAGER_CONFIG.dpopKeyStoreConfig,
      logger: config.logger ?? DEFAULT_AUTH_MANAGER_CONFIG.logger,
    };"""
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('auth config merge marker not found')

          temporary = Path('.github/workflows/sdk-auth-review-fix.yml')
          if temporary.exists():
              temporary.unlink()
          PY

      - name: Commit review fix when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sdk/ts/src/auth/auth-manager.ts .github/workflows/sdk-auth-review-fix.yml
          git commit -m "Preserve auth defaults when optional config is undefined"
          git push origin HEAD:${{ github.head_ref }}

  verify:
    name: Verify auth-manager compiler baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/ts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run strict SDK typecheck and isolate auth diagnostics
        run: |
          set -o pipefail
          npm run typecheck > typecheck.log 2>&1 || true
          cat typecheck.log
          if grep -Fq 'src/auth/auth-manager.ts' typecheck.log; then
            echo 'auth-manager.ts still has TypeScript diagnostics' >&2
            exit 1
          fi

      - name: Verify public auth exports and defensive defaults
        run: |
          test "$(grep -c '^export class InMemoryTokenStorage' src/auth/auth-manager.ts)" -eq 1
          test "$(grep -c '^export class SecureTokenStorage' src/auth/auth-manager.ts)" -eq 1
          test "$(grep -c '^export function generatePkcePair' src/auth/auth-manager.ts)" -eq 1
          ! grep -Fq 'export { InMemoryTokenStorage, SecureTokenStorage, generatePkcePair };' src/auth/auth-manager.ts
          grep -Fq 'scopes: config.scopes ?? DEFAULT_AUTH_MANAGER_CONFIG.scopes' src/auth/auth-manager.ts
          grep -Fq 'useDpop: config.useDpop ?? DEFAULT_AUTH_MANAGER_CONFIG.useDpop' src/auth/auth-manager.ts
          grep -Fq 'config.dpopKeyStoreConfig ?? DEFAULT_AUTH_MANAGER_CONFIG.dpopKeyStoreConfig' src/auth/auth-manager.ts
          grep -Fq 'logger: config.logger ?? DEFAULT_AUTH_MANAGER_CONFIG.logger' src/auth/auth-manager.ts
