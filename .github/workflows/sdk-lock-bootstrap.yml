name: Bootstrap SDK lockfile

on:
  push:
    branches:
      - agent/phase-pr3-sdk-runtime-hardening

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-pr3-sdk-runtime-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sdk/ts/package.json
      - name: Generate lockfile without lifecycle scripts
        working-directory: sdk/ts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          if git diff --quiet -- sdk/ts/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sdk/ts/package-lock.json
          git commit -m "Add deterministic TypeScript SDK lockfile"
          git push origin HEAD:agent/phase-pr3-sdk-runtime-hardening
