name: TypeScript SDK policy baseline

on:
  pull_request:
    paths:
      - 'sdk/ts/src/clients/policy-client.ts'
      - 'sdk/ts/test/policy-client-baseline.test.ts'
      - '.github/workflows/typescript-sdk-policy-baseline.yml'
  push:
    branches: [main]
    paths:
      - 'sdk/ts/src/clients/policy-client.ts'
      - 'sdk/ts/test/policy-client-baseline.test.ts'
      - '.github/workflows/typescript-sdk-policy-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typescript-sdk-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify policy client baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Isolate policy-client TypeScript diagnostics
        run: |
          npm run typecheck > typecheck.log 2>&1 || true
          if grep -F 'src/clients/policy-client.ts' typecheck.log; then
            echo 'policy-client.ts still has TypeScript diagnostics' >&2
            exit 1
          fi
          echo 'No policy-client TypeScript diagnostics found.'
      - name: Run focused policy tests when present
        run: |
          if test -f test/policy-client-baseline.test.ts; then
            npx jest --runInBand test/policy-client-baseline.test.ts
          fi
