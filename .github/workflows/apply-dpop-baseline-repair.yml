name: Apply DPoP baseline repair

on:
  push:
    branches:
      - agent/phase-pr5-sdk-dpop-baseline

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-pr5-sdk-dpop-baseline
          fetch-depth: 0
      - name: Repair DPoP key-store baseline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('sdk/ts/src/auth/dpop-keystore.ts')
          text = path.read_text()
          text = text.replace(
            "import type { DpopKeyPair, JsonWebKey, DpopProof, DpopProofOptions } from '../types';",
            "import type { DpopClaims, DpopHeader, DpopKeyPair, JsonWebKey, DpopProof, DpopProofOptions, SolidSidecarLogger } from '../types';"
          )
          text = text.replace(
            "import { generateUuid, sha256Base64UrlSync, base64UrlEncode } from '../utils';\nimport { environment } from '../utils';",
            "import { generateUuid, sha256Base64UrlSync, base64UrlEncode, environment, nullLogger } from '../utils';"
          )
          text = text.replace(
            "export const DEFAULT_DPOP_KEYSTORE_CONFIG: Required<DpopKeyStoreConfig> = {\n  storage: undefined,",
            "type ResolvedDpopKeyStoreConfig = Omit<Required<DpopKeyStoreConfig>, 'storage'> & {\n  storage?: DpopKeyStorage;\n};\n\nexport const DEFAULT_DPOP_KEYSTORE_CONFIG: Omit<ResolvedDpopKeyStoreConfig, 'storage'> = {"
          )
          text = text.replace(
            "  private readonly config: Required<DpopKeyStoreConfig>;\n  private readonly storage: DpopKeyStorage;\n  private readonly logger: Console;",
            "  private readonly config: ResolvedDpopKeyStoreConfig;\n  private readonly storage: DpopKeyStorage;\n  private readonly logger: SolidSidecarLogger;"
          )
          text = text.replace(
            "    this.config = {\n      ...DEFAULT_DPOP_KEYSTORE_CONFIG,\n      ...config,\n    };",
            "    this.config = {\n      ...DEFAULT_DPOP_KEYSTORE_CONFIG,\n      ...config,\n      storage: config.storage,\n      defaultAlgorithm: config.defaultAlgorithm ?? DEFAULT_DPOP_KEYSTORE_CONFIG.defaultAlgorithm,\n      ecKeySize: config.ecKeySize ?? DEFAULT_DPOP_KEYSTORE_CONFIG.ecKeySize,\n      rsaKeySize: config.rsaKeySize ?? DEFAULT_DPOP_KEYSTORE_CONFIG.rsaKeySize,\n      autoRotate: config.autoRotate ?? DEFAULT_DPOP_KEYSTORE_CONFIG.autoRotate,\n      rotationInterval: config.rotationInterval ?? DEFAULT_DPOP_KEYSTORE_CONFIG.rotationInterval,\n      maxKeys: config.maxKeys ?? DEFAULT_DPOP_KEYSTORE_CONFIG.maxKeys,\n    };"
          )
          text = text.replace(
            "    this.storage = this.config.storage || new InMemoryKeyStore();\n    this.logger = console;",
            "    this.storage = this.config.storage ?? new InMemoryKeyStore();\n    this.logger = nullLogger;"
          )
          text = text.replace("    const header = {", "    const header: DpopHeader = {")
          text = text.replace("    const claims: Record<string, unknown> = {", "    const claims: DpopClaims = {")
          text = text.replace("      htm: method.toUpperCase(),", "      htm: method.toUpperCase() as DpopClaims['htm'],")
          text = text.replace("      ...(jwk.e && { e: jwk.e }),\n      ...(jwk.d && { d: jwk.d }),", "      ...(jwk.e && { e: jwk.e }),")
          old = """      const algorithm = this.getAlgorithmFromKey(privateKey as JsonWebKey);
      const signature = crypto.sign(
        algorithm.replace('ES', '').replace('RS', '').replace('Ed', ''),
        Buffer.from(data, 'utf8'),
        keyObject
      );"""
          new = """      const algorithm = this.getAlgorithmFromKey(privateKey);
      const digest = algorithm === 'EdDSA' ? null : `sha${algorithm.slice(2)}`;
      const signature = crypto.sign(digest, Buffer.from(data, 'utf8'), {
        key: keyObject,
        ...(algorithm.startsWith('ES') && { dsaEncoding: 'ieee-p1363' }),
      });"""
          if old not in text:
            raise SystemExit('Node signing marker not found')
          text = text.replace(old, new, 1)
          text = text.replace("    this.activeKeyId = null;\n", "", 1)
          footer = "\n// ============================================================================\n// Exports\n// ============================================================================\n\nexport { InMemoryKeyStore, SecureKeyStore };\nexport type { DpopKeyStorage };\n"
          text = text.replace(footer, "\n")
          path.write_text(text)
          Path('.github/workflows/apply-dpop-baseline-repair.yml').unlink()
          PY
      - name: Commit DPoP repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sdk/ts/src/auth/dpop-keystore.ts .github/workflows/apply-dpop-baseline-repair.yml
          git commit -m "Repair DPoP key-store compiler and signing baseline"
          git push origin HEAD:agent/phase-pr5-sdk-dpop-baseline
