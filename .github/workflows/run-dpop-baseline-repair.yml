name: Run DPoP baseline repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-pr5-sdk-dpop-baseline
          fetch-depth: 0

      - name: Execute registered repair script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/apply-dpop-baseline-repair.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = dedent(workflow[start:end])
          exec(compile(script, 'apply-dpop-baseline-repair.py', 'exec'))
          Path('.github/workflows/run-dpop-baseline-repair.yml').unlink()
          PY

      - name: Commit repaired implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair DPoP key-store compiler and signing baseline"
          git push origin HEAD:agent/phase-pr5-sdk-dpop-baseline
