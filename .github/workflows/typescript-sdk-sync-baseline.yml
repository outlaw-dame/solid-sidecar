name: TypeScript SDK Sync baseline

on:
  pull_request:
    paths:
      - 'sdk/ts/src/clients/sync-client.ts'
      - 'sdk/ts/test/sync-client-baseline.test.ts'
      - '.github/workflows/typescript-sdk-sync-baseline.yml'
  push:
    branches: [main]
    paths:
      - 'sdk/ts/src/clients/sync-client.ts'
      - 'sdk/ts/test/sync-client-baseline.test.ts'
      - '.github/workflows/typescript-sdk-sync-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typescript-sdk-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Sync client baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Isolate Sync-client TypeScript diagnostics
        run: |
          npm run typecheck > typecheck.log 2>&1 || true
          if grep -F 'src/clients/sync-client.ts' typecheck.log; then
            echo 'sync-client.ts still has TypeScript diagnostics' >&2
            exit 1
          fi
          echo 'No Sync-client TypeScript diagnostics found.'
      - name: Run focused Sync tests when present
        run: |
          if test -f test/sync-client-baseline.test.ts; then
            npx jest --runInBand test/sync-client-baseline.test.ts 2>&1 | tee sync-jest.log
          fi
      - name: Upload Sync diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-test-diagnostics
          path: |
            sdk/ts/sync-jest.log
            sdk/ts/typecheck.log
          if-no-files-found: ignore
          retention-days: 7
