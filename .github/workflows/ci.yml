name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Verify Go
        run: |
          set -o pipefail
          bash scripts/verify.sh go 2>&1 | tee go-verify.log
          exit ${PIPESTATUS[0]}

      - name: Upload Go verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-verify-log
          path: go-verify.log
          if-no-files-found: warn
          retention-days: 7

  rust:
    name: Rust policy kernel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify Rust
        run: |
          set -o pipefail
          bash scripts/verify.sh rust 2>&1 | tee rust-verify.log
          exit ${PIPESTATUS[0]}

      - name: Upload Rust verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-verify-log
          path: rust-verify.log
          if-no-files-found: warn
          retention-days: 7

  govulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: stable
          go-package: ./...
