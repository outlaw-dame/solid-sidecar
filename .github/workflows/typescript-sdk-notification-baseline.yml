name: TypeScript SDK notification baseline

on:
  pull_request:
    paths:
      - 'sdk/ts/src/clients/notification-client.ts'
      - 'sdk/ts/test/notification-client-baseline.test.ts'
      - '.github/workflows/typescript-sdk-notification-baseline.yml'
  push:
    branches:
      - main
    paths:
      - 'sdk/ts/src/clients/notification-client.ts'
      - 'sdk/ts/test/notification-client-baseline.test.ts'
      - '.github/workflows/typescript-sdk-notification-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typescript-sdk-notification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify notification client baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/ts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run strict SDK typecheck and isolate notification diagnostics
        run: |
          set -o pipefail
          npm run typecheck > typecheck.log 2>&1 || true
          cat typecheck.log
          if grep -Fq 'src/clients/notification-client.ts' typecheck.log; then
            echo 'notification-client.ts still has TypeScript diagnostics' >&2
            exit 1
          fi
      - name: Run focused notification tests when present
        run: |
          if test -f test/notification-client-baseline.test.ts; then
            npx jest --runInBand test/notification-client-baseline.test.ts
          fi
