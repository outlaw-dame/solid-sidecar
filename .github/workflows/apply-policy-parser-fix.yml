name: Apply policy parser fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-policy-parser-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Repair WAC accessTo parser contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('sdk/ts/src/clients/policy-client.ts')
          text = path.read_text()
          old = "        accessTo: accessTo.length === 1 ? accessTo[0]! : accessTo,"
          new = "        accessTo: accessTo[0]!,"
          if old not in text:
              raise SystemExit('accessTo parser assignment not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sdk/ts/src/clients/policy-client.ts
          git commit -m 'Align WAC parser with accessTo contract'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
