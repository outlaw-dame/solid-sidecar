global:
  # Scrape interval for all targets
  scrape_interval: 15s
  
  # Evaluation interval for rules
  evaluation_interval: 15s
  
  # Scrape timeout
  scrape_timeout: 10s

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Rule files for alerting
rule_files:
  - /etc/prometheus/alert-rules.yaml

# Scrape configurations
scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    
    # Metrics path
    metrics_path: '/metrics'
    
    # Scrape interval (overrides global)
    scrape_interval: 60s
    
    # Scrape timeout
    scrape_timeout: 5s

  # Scrape solid-sidecar
  - job_name: 'solid-sidecar'
    static_configs:
      - targets: ['solid-sidecar:9090']
    
    # Metrics path
    metrics_path: '/metrics'
    
    # Scrape interval
    scrape_interval: 15s
    
    # Scrape timeout
    scrape_timeout: 10s
    
    # Relabel configuration
    relabel_configs:
      - source_labels: [__address__]
        target_label: __scheme__
        replacement: 'http'
      - source_labels: [__address__]
        target_label: instance
        regex: '(.*):\d+'
        replacement: '$1'
    
    # Metric relabeling
    metric_relabel_configs:
      # Drop high-cardinality labels
      - source_labels: [request_id, correlation_id]
        regex: '.*'
        action: drop

  # Scrape CSS backend (if exposing metrics)
  - job_name: 'css-backend'
    static_configs:
      - targets: ['css-production:3000']
    
    # Metrics path (CSS uses /metrics if enabled)
    metrics_path: '/metrics'
    
    # Scrape interval
    scrape_interval: 30s
    
    # Scrape timeout
    scrape_timeout: 10s

  # Scrape node exporter (if available)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    
    # Scrape interval
    scrape_interval: 30s
    
    # Scrape timeout
    scrape_timeout: 10s

  # Scrape cadvisor (if available)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    
    # Scrape interval
    scrape_interval: 30s
    
    # Scrape timeout
    scrape_timeout: 10s

# Remote write configuration (for long-term storage)
# Uncomment and configure if using remote storage
#remote_write:
