# Storage configuration
storage:
  tsdb:
    # Retention period
    retention.time: 30d
    
    # Block ranges
    retention.size: "50GB"
    
    # WAL settings
    wal_compression: true
    
    # Compaction
    compaction:
      enabled: true
      interval: 1h

# Web configuration
web:
  # Enable admin APIs
  enable_admin_api: false
  
  # Enable lifecycle API
  enable_lifecycle: true
  
  # Console libraries
  console.libraries:
    - /etc/prometheus/console_libraries
  
  # Console templates
  console.templates:
    - /etc/prometheus/consoles
  
  # Page title
  page_title: 'Solid Sidecar - Prometheus'

# Recording rules (pre-computed metrics for efficiency)
recording_rules:
  - name: 'solid-sidecar.rules'
    interval: 60s
    rules:
      # Request rate
      - record: job:solid_sidecar:request_rate_5m
        expr: rate(http_requests_total{job="solid-sidecar"}[5m])
      
      # Error rate
      - record: job:solid_sidecar:error_rate_5m
        expr: rate(http_requests_total{job="solid-sidecar", status_code=~"5.."}[5m])
      
      # Success rate
      - record: job:solid_sidecar:success_rate_5m
        expr: rate(http_requests_total{job="solid-sidecar", status_code=~"2.."}[5m])
      
      # Latency percentiles
      - record: job:solid_sidecar:latency_p50_5m
        expr: histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{job="solid-sidecar"}[5m])) by (le))
      
      - record: job:solid_sidecar:latency_p95_5m
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job="solid-sidecar"}[5m])) by (le))
      
      - record: job:solid_sidecar:latency_p99_5m
        expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{job="solid-sidecar"}[5m])) by (le))
      
      # AuthZ metrics
      - record: job:solid_sidecar:authz_decisions_5m
        expr: rate(solid_sidecar_authz_decisions_total[5m])
      
      - record: job:solid_sidecar:authz_allow_rate_5m
        expr: rate(solid_sidecar_authz_decisions_total{decision="allow"}[5m])
      
      - record: job:solid_sidecar:authz_deny_rate_5m
        expr: rate(solid_sidecar_authz_decisions_total{decision="deny"}[5m])
      
      - record: job:solid_sidecar:authz_abstain_rate_5m
        expr: rate(solid_sidecar_authz_decisions_total{decision="abstain"}[5m])
      
      # Cache metrics
      - record: job:solid_sidecar:cache_hit_rate_5m
        expr: rate(solid_sidecar_cache_hits_total[5m]) / rate(solid_sidecar_cache_requests_total[5m])
      
      # Transport metrics
      - record: job:solid_sidecar:transport_requests_5m
        expr: rate(solid_sidecar_transport_requests_total[5m])
      
      - record: job:solid_sidecar:transport_failures_5m
        expr: rate(solid_sidecar_transport_failures_total[5m])
