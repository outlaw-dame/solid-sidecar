# Example Phase 4.2 Solid sidecar configuration.
# The sidecar listens publicly and reverse-proxies to Community Solid Server.
server:
  address: ":8443"
  read_header_timeout: "5s"
  read_timeout: "15s"
  write_timeout: "15s"
  idle_timeout: "60s"
  shutdown_timeout: "10s"
  max_header_bytes: 1048576

backend:
  url: "http://127.0.0.1:3000"
  health_path: "/"
  timeout: "30s"

limits:
  # 32 MiB default. Tune higher only after deciding upload/media handling policy.
  max_body_bytes: 33554432

rate_limit:
  enabled: true
  requests_per_window: 600
  window: "1m"

security:
  # Empty means the sidecar does not enforce an Origin allowlist and leaves CORS
  # behavior to CSS. Set a comma-separated list to make the sidecar enforce the
  # boundary before requests reach CSS.
  allowed_origins: ""

auth:
  # Phase 3 only performs authentication preflight checks. CSS remains the final
  # Solid authorization authority.
  preflight_enabled: true
  require_dpop_for_dpop_authorization: true
  validate_dpop_signature: true
  max_clock_skew: "5m"
  replay_window: "10m"
  # Set this in production so DPoP htu is compared against the public sidecar URL
  # instead of the internal listener URL.
  public_base_url: ""

authz:
  # Phase 4.2 shadow observation is disabled by default. When enabled, the Go
  # sidecar builds authz.v1 request contracts and logs abstain decisions, but it
  # still passes all requests through to CSS.
  shadow_enabled: false
  # Optional public base URL for authz.v1 resource_uri construction. Leave empty
  # to derive the URI from the incoming request host/scheme.
  public_base_url: ""

log:
  level: "info"
