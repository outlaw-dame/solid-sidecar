services:
  css:
    image: solidproject/community-server:latest
    command:
      - -f
      - /data
    ports:
      - "3000:3000"
    volumes:
      - css-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s

  sidecar:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.sidecar
    command:
      - -config
      - /etc/solid-sidecar/sidecar.yaml
    environment:
      SOLID_SIDECAR_BACKEND_URL: http://css:3000
    ports:
      - "8443:8443"
    volumes:
      - ../../configs/sidecar.example.yaml:/etc/solid-sidecar/sidecar.yaml:ro
    depends_on:
      css:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8443/healthz"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s

volumes:
  css-data:
