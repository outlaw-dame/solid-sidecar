version: '3.8'

# Production Docker Compose configuration for solid-sidecar
# This file is designed for production deployments with proper security,
# monitoring, and reliability configurations.

services:
  # Solid Sidecar Service
  solid-sidecar:
    image: ghcr.io/outlaw-dame/solid-sidecar:latest
    container_name: solid-sidecar-production
    restart: unless-stopped
    
    # Security configuration
    user: "1000:1000"  # Run as non-root user
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    
    # Network configuration
    networks:
      - solid-network
    dns:
      - 8.8.8.8
      - 8.8.4.4
    
    # Port configuration
    ports:
      - "443:443"
      - "9090:9090"  # Metrics port
    
    # Environment variables
    environment:
      - SIDECARE_CONFIG=/etc/solid/config.yaml
      - SIDECARE_LOG_LEVEL=info
      - SIDECARE_LOG_FORMAT=json
      - SIDECARE_ENVIRONMENT=production
      
      # Resource limits
      - GOMAXPROCS=4
      - GOMEMLIMIT=512MiB
      
      # Security
      - TZ=UTC
      - NODE_ENV=production
    
    # Volume mounts
    volumes:
      # Configuration
      - ./configs:/etc/solid:ro
      
      # TLS certificates (read-only)
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - /etc/ssl/private:/etc/ssl/private:ro
      
      # SSH known hosts (read-only)
      - ./configs/ssh_known_hosts:/etc/solid/ssh_known_hosts:ro
      
      # Temporary directory for caches
      - /var/cache/solid:/var/cache/solid
    
    # Health checks
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    
    # Logging configuration
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        tags: "service=solid-sidecar,environment=production"
    
    # Dependencies
    depends_on:
      css-production:
        condition: service_healthy
      prometheus:
        condition: service_started
    
    # Labels for service discovery
    labels:
      - "com.example.description=Solid Sidecar Production"
      - "prometheus.scrape=true"
      - "prometheus.port=9090"
      - "prometheus.path=/metrics"

  # Community Solid Server (CSS) - Production
  css-production:
    image: solidproject/community-solid-server:latest
    container_name: css-production
    restart: unless-stopped
    
    networks:
      - solid-network
    
    ports:
      - "3000:3000"
    
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SOLID_META_RDF=true
    
    volumes:
      - css-data:/data
      - css-config:/config
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 512M

  # Prometheus for Metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-production
    restart: unless-stopped
    
    networks:
      - solid-network
    
    ports:
      - "9090:9090"
    
    volumes:
      - ./configs/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./configs/monitoring/alert-rules.yaml:/etc/prometheus/alert-rules.yaml:ro
      - prometheus-data:/prometheus
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # Grafana for Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-production
    restart: unless-stopped
    
    networks:
      - solid-network
    
    ports:
      - "3001:3000"
    
    volumes:
      - grafana-data:/var/lib/grafana
      - ./configs/monitoring/grafana-provisioning:/etc/grafana/provisioning:ro
    
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Jaeger for Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger-production
    restart: unless-stopped
    
    networks:
      - solid-network
    
    ports:
      - "16686:16686"  # UI
      - "14268:14268"  # HTTP collector
      - "14250:14250"  # gRPC collector
    
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - COLLECTOR_OTLP_ENABLED=true
    
    volumes:
      - jaeger-data:/data
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:16686/"]
      interval: 30s
      timeout: 5s
      retries: 3
    
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # Alertmanager for Alerts
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager-production
    restart: unless-stopped
    
    networks:
      - solid-network
    
    ports:
      - "9093:9093"
    
    volumes:
      - ./configs/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Reverse Proxy / Load Balancer (Optional)
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    
    networks:
      - solid-network
    
    ports:
      - "80:80"
      - "8443:443"
    
    volumes:
      - ./configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./configs/nginx/ssl:/etc/nginx/ssl:ro
    
    depends_on:
      - solid-sidecar
      - css-production
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

# Networks
networks:
  solid-network:
    driver: bridge
    name: solid-production-network

# Volumes
volumes:
  css-data:
    driver: local
  css-config:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  jaeger-data:
    driver: local
  alertmanager-data:
    driver: local
